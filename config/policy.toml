[task_policy]
require_single_repo = true
require_acceptance_criteria = true
require_verification_commands = true
require_handoff_summary = true
max_files_touched = 3
max_expected_minutes = 30
max_attempts = 3
max_task_runtime_seconds = 1800
max_daemon_runtime_seconds = 3600
max_tasks_per_run = 1
max_tasks_per_day = 24
max_consecutive_failures = 3
split_if_touches_multiple_subsystems = true
split_if_research_and_code_are_mixed = true

[daemon_policy]
loop_interval_seconds = 300
idle_sleep_seconds = 60
run_discovery_before_tasks = true
