[repos.example]
path = "/tmp/coordinator-example-repo"
default_branch = "main"
remote = "origin"
branch_prefix = "coord/"
allow_push = false
merge_policy = "no_push"
verify_commands = ["python -m unittest"]
review_policy = "tests_only"

# Supported review_policy values:
# auto, branch_only, always_human, risky_human, tests_only, full_review
